<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apoyos Escalera · Ingreso</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="page-login">

  <div class="login-bg"><div class="login-grid"></div></div>

  <div class="login-wrap">

    <div class="login-header">
      <div class="login-icon"></div>
      <h1 class="login-title">APOYOS<span>ESCALERA</span></h1>
      <p class="login-sub">Sistema Operativo de Campo · Conectar</p>
    </div>

    <div class="login-card">

      <div class="field">
        <label class="field-label">USUARIO</label>
                <input type="email" id="login-email" class="field-input"
              placeholder="correo@empresa.com"
              autocomplete="username"
              onkeydown="if(event.key==='Enter') doLogin()">
      </div>

      <div class="field">
        <label class="field-label">CONTRASEÑA</label>
        <input type="password" id="login-pass" class="field-input"
              placeholder="••••••••"
              autocomplete="current-password"
              onkeydown="if(event.key==='Enter') doLogin()">
      </div>

      <button class="btn-login" onclick="doLogin()">
        <span>INGRESAR AL SISTEMA</span>
        <span class="btn-arrow">→</span>
      </button>

      <p id="login-error" class="login-error"></p>
    </div>

    <div class="login-hint">
      <span class="hint-label">CREDENCIALES DE PRUEBA</span>
      <div class="hint-creds">
        <div>👷 tecnico@conectar.com · Tec2025</div>
        <div>🚗 conductor@conectar.com · Con2025</div>
        <div>🛡️ admin@conectar.com · Adm2025</div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  <script>
    // Si ya hay sesión activa, redirigir directo
    (function() {
      const u = obtenerSesion();
      if (u) window.location.href = u.role + ".html";
    })();

    function doLogin() {
      const email  = document.getElementById("login-email").value.trim().toLowerCase();
      const pass   = document.getElementById("login-pass").value.trim();
      const errEl  = document.getElementById("login-error");
      errEl.innerText = "";

      if (!email) { errEl.innerText = "❌ Ingresa tu correo";      return; }
      if (!pass)  { errEl.innerText = "❌ Ingresa tu contraseña";  return; }

      const user = USERS[email];
      if (!user)              { errEl.innerText = "❌ Usuario no encontrado";  return; }
      if (user.pass !== pass) { errEl.innerText = "❌ Contraseña incorrecta"; return; }

      guardarSesion({ email, role: user.role, name: user.name });
      window.location.href = user.role + ".html";
    }
  </script>
</body>
</html>
